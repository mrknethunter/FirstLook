[project]
name = "firstlook"
version = "0.1.0"
description = "Patient-owned emergency profile for the HackYeah 2026 synthetic-data demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25,<26",
  "cryptography>=50.0.2,<51",
  "email-validator>=2.3,<3",
  "fastapi>=0.115,<1",
  "fhir-resources>=8,<9",
  "ijson>=3.4,<4",
  "jwcrypto>=1.5,<2",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "reportlab>=4,<5",
  "segno>=1.6,<2",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "structlog>=25.2,<26",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
  "types-jwcrypto>=1.5,<2",
  "types-pyyaml>=6,<7",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firstlook"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["firstlook", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["firstlook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
